<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>configurazione piattaforma</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: linear-gradient(135deg, #eef2f7, #f7f9fc);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px;
  color:#333;
}

h1 {
  text-align: center;
  font-size:40px;
  margin-bottom:30px;
  color:#222;
}

#box-caricamento {
  background: white;
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  padding: 25px;
  margin: 20px auto;
  width: 420px;
  text-align: center;
  transition:0.3s;
}

#box-caricamento:hover{
  transform: translateY(-3px);
}

#box-caricamento h2{
  margin-bottom:10px;
  color:#444;
}

input[type="file"] {
  margin-top: 15px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fafafa;
  cursor:pointer;
}

button {
  margin-top:25px;
  padding:14px 22px;
  border:none;
  border-radius:10px;
  background:#4a90e2;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button:hover {
  background:#357abd;
  transform: scale(1.05);
}

button:active{
  transform: scale(0.98);
}

</style>

</head>

<body>

<h1>Lettore file CSV</h1>

<div id="box-caricamento">
  <h2>Scegli il file .csv</h2>
  <input type="file" id="fileInput" accept=".csv">
</div>

<button type="button" id="button">vai al catalogo</button>

<script>
  const button = document.getElementById("button");
  const fileInput = document.getElementById("fileInput");

  button.onclick = function () {
    if (!fileInput.files.length) {
      alert("seleziona un file csv prima di continuare");
      return;
    }
    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function (e) {
      const testo = e.target.result;
      localStorage.setItem("csvdata",testo);
      window.location.href = "catalogo.html";
    }

    reader.readAsText(file);
  };
</script>

</body>
</html>
