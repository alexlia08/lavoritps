<html>
<head>
    <title>Convertitore Valute</title>
</head>

<body>

    <h2>Convertitore Valute in Euro</h2>

    <p>Seleziona la valuta:</p>

    <select id="valuta">

        <option value="GBP">Sterlina</option>
        <option value="CHF">Franco Svizzero</option>
        <option value="JPY">Yen</option>
    </select>

    <p>Inserisci la quantita':</p>

    <input type="text" id="quantita">

    <br><br>

    <input type="button" value="Converti" onclick="converti()">

    <h3 id="risultato"></h3>

    <script src="script.js"></script>

</body>
</html>
