
<!DOCTYPE HTML>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Tabella Andamento Nazionale COVID-19</title>

    <style type="text/css">
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7fb;
            color: #243247;
        }

        h2 {
            color: #1e3a5f;
            font-size: 26px;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 3px solid #38bdf8;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(30, 58, 95, 0.08);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            text-align: left;
        }

        th {
            background-color: #1e3a5f;
            color: white;
            font-weight: 600;
        }

        tr.pari {
            background-color: #f1f5f9;
        }

        tbody tr:hover {
            background-color: #e0f2fe;
        }

        #dati-container {
            margin-top: 15px;
            overflow-x: auto;
            border-radius: 8px;
        }

        .errore {
            color: #dc2626;
            background-color: #fef2f2;
            padding: 12px;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            body {
                margin: 15px;
            }

            h2 {
                font-size: 21px;
            }

            th, td {
                padding: 9px;
            }
        }
    </style>
</head>

<body>

    <h2>Tabella Andamento Nazionale COVID-19</h2>

    <div id="dati-container">Caricamento dati in corso...</div>

    <script type="text/javascript">

        var url = "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json";

        // Creazione dell'oggetto XMLHttpRequest
        var xhr = new XMLHttpRequest();

        xhr.open("GET", url, true);

        xhr.onreadystatechange = function() {

            if (xhr.readyState === 4) {

                var contenitore =
                    document.getElementById("dati-container");

                if (xhr.status === 200) {

                    try {

                        // Lettura della risposta JSON
                        var dati = JSON.parse(xhr.responseText);

                        if (dati.length === 0) {
                            contenitore.textContent =
                                "Nessun dato disponibile.";
                            return;
                        }

                        // Primo oggetto della risposta
                        var obj = dati[0];

                        // Numero delle chiavi dell'oggetto
                        var numeroChiavi = Object.keys(obj).length;

                        // Collection dinamica delle chiavi
                        var keys = Object.keys(obj);

                        // Creazione della tabella
                        var tabella = document.createElement("table");
                        var thead = document.createElement("thead");
                        var tbody = document.createElement("tbody");

                        // Creazione dinamica delle intestazioni
                        var trIntestazione =
                            document.createElement("tr");

                        for (var i = 0; i < numeroChiavi; i++) {

                            var th = document.createElement("th");

                            th.textContent = keys[i];

                            trIntestazione.appendChild(th);
                        }

                        thead.appendChild(trIntestazione);
                        tabella.appendChild(thead);

                        // Creazione dinamica delle righe
                        for (var i = 0; i < dati.length; i++) {

                            var row = dati[i];
                            var tr = document.createElement("tr");

                            if (i % 2 === 0) {
                                tr.className = "pari";
                            }

                            // Utilizzo della collection di chiavi
                            for (var j = 0; j < numeroChiavi; j++) {

                                var td = document.createElement("td");

                                var chiave = keys[j];
                                var valore = row[chiave];

                                td.textContent =
                                    valore !== undefined &&
                                    valore !== null
                                    ? valore
                                    : "";

                                tr.appendChild(td);
                            }

                            tbody.appendChild(tr);
                        }

                        tabella.appendChild(tbody);

                        // Visualizzazione della tabella
                        contenitore.textContent = "";
                        contenitore.appendChild(tabella);

                    } catch (errore) {

                        contenitore.textContent =
                            "Errore durante l'elaborazione dei dati.";

                        contenitore.className = "errore";
                    }

                } else {

                    contenitore.textContent =
                        "Errore HTTP: " + xhr.status;

                    contenitore.className = "errore";
                }
            }
        };

        // Gestione degli errori di rete
        xhr.onerror = function() {

            var contenitore =
                document.getElementById("dati-container");

            contenitore.textContent =
                "Errore di rete durante il caricamento.";

            contenitore.className = "errore";
        };

        // Invio della richiesta
        xhr.send();

    </script>

</body>
</html>
